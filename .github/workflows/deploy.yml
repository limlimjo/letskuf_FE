
name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: letskuf-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: letskuf-frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build React application
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --tag "$REGISTRY/$ECR_REPOSITORY:latest" \
            --push .

      - name: Deploy to EC2 via SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # EC2에서 실행할 배포 스크립트
          cat > deploy-frontend.sh <<'REMOTE'
          #!/bin/bash
          set -euo pipefail

          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${REGISTRY}/letskuf-frontend:${IMAGE_TAG}"

          echo "Logging in to ECR..."
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

          echo "Pulling image: $IMAGE"
          docker pull "$IMAGE"

          echo "Removing existing frontend container..."
          docker rm -f letskuf-frontend 2>/dev/null || true

          echo "Starting frontend container..."
          docker run -d \
            --name letskuf-frontend \
            --restart unless-stopped \
            -p 127.0.0.1:3000:80 \
            "$IMAGE"

          echo "Waiting for frontend startup..."
          sleep 5

          echo "Container status:"
          docker ps -a --filter name=letskuf-frontend

          echo "Frontend container logs:"
          docker logs --tail 50 letskuf-frontend

          echo "Checking frontend HTTP response..."
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/ \
            -o /dev/null

          echo "Frontend deployment completed."
          REMOTE

          DEPLOY_SCRIPT_BASE64=$(base64 -w 0 deploy-frontend.sh)

          SSM_COMMAND="echo '$DEPLOY_SCRIPT_BASE64' | base64 -d > /tmp/deploy-frontend.sh && AWS_ACCOUNT_ID='$AWS_ACCOUNT_ID' AWS_REGION='$AWS_REGION' IMAGE_TAG='$IMAGE_TAG' bash /tmp/deploy-frontend.sh"

          jq -n \
            --arg command "$SSM_COMMAND" \
            '{commands: [$command]}' > ssm-parameters.json

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --comment "Deploy letskuf frontend ${IMAGE_TAG}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"
          INVOCATION=""

          for attempt in $(seq 1 60); do
            INVOCATION=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json 2>/dev/null || true)

            STATUS=$(printf '%s' "$INVOCATION" |
              jq -r '.Status // "Pending"')

            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled|Undeliverable|Terminated)
                break
                ;;
            esac

            sleep 5
          done

          echo "Deployment status: $STATUS"

          if [ -n "$INVOCATION" ]; then
            echo "----- STDOUT -----"
            printf '%s' "$INVOCATION" |
              jq -r '.StandardOutputContent // ""'

            echo "----- STDERR -----"
            printf '%s' "$INVOCATION" |
              jq -r '.StandardErrorContent // ""'
          fi

          if [ "$STATUS" != "Success" ]; then
            echo "SSM frontend deployment failed or timed out."
            exit 1
          fi

          echo "Frontend deployment completed successfully."